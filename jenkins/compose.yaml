name: store-jenkins

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    user: root
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro

volumes:
  jenkins-home:
